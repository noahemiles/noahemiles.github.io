
<div class="form-page">
    <div class="form">
        <h2>User Form</h2>
        <label for="user-name">Name: </label>
        <input type="text" name="user-name" id="user-name" class="name" required>
        <label for="user-email">Email: </label>
        <input type="email" name="user-email" id="user-email" class="email">
        <div>
            <button type="submit" (click)="onSubmit()">Add User</button>
            <b class="error">{{ errorMessage }}</b>
        </div>
    </div>
    <div class="user-display">
        @for (user of users | keyvalue; track user.key) {
            <app-user-tile [id]="user.value.id"></app-user-tile>
        }
    </div>
</div>
